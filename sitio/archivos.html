<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brazo Robótico 6 GDL · UMSA</title>
<meta name="description" content="Documentación del brazo robótico XK-JS5B de 6 grados de libertad — Laboratorio integrado ETN-902 / ETN-1034 / ETN-1000, UMSA.">
<link rel="icon" href="img/umsa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=localStorage.getItem('tema');if(t)document.documentElement.dataset.tema=t}catch(e){}</script>
</head>
<body data-pagina="archivos">
<main>
<div class="explorador">
  <nav class="tarjeta arbol" id="arbol" aria-label="Carpetas"></nav>
  <div class="explorador__main">
    <div class="exp-barra">
      <label class="campo"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="textoBusqueda" type="search" placeholder="Buscar por nombre o carpeta…" aria-label="Buscar archivos" autocomplete="off"></label>
      <select class="selector" id="filtroTipo" aria-label="Tipo de archivo"></select>
      <select class="selector" id="orden" aria-label="Ordenar">
        <option value="nombre">Ordenar: nombre</option><option value="tamano">Ordenar: tamaño</option><option value="tipo">Ordenar: tipo</option>
      </select>
    </div>
    <nav class="migas" id="migas" aria-label="Ubicación"></nav>
    <div class="exp-info"><div id="expInfo" style="display:flex;gap:6px 16px;flex-wrap:wrap"></div>
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <label class="interruptor" id="soloAquiCaja" hidden><input type="checkbox" id="soloAqui"> Buscar sólo en esta carpeta</label>
        <label class="interruptor"><input type="checkbox" id="verComp"> Mostrar archivos de compilación</label>
      </div></div>
    <div id="listaArchivos"><p class="cargando-txt">Cargando índice…</p></div>
  </div>
</div>
</main>
<script src="js/datos.js"></script>
<script src="js/layout.js"></script>
<script src="js/visor.js"></script>
<script src="js/paginas/archivos.js"></script>
</body>
</html>
